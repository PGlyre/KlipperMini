# macros.cfg
# Custom macros for Prusa Mini+ with Klipper / KlipperMini
# All texts are in English only.

[gcode_macro PRINT_START]
description: PGe10 auto-mesh start for Prusa Mini+ (adaptive mesh + primeline)
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set HOTEND = params.EXTRUDER_TEMP|default(220)|float %}
    {% set RET_LEN = params.RETRACT_LENGTH|default(0.8)|float %}
    {% set RET_SPD = params.RETRACT_SPEED|default(35)|float %}
    {% set UNRET_SPD = params.UNRETRACT_SPEED|default(35)|float %}

    # -------------------------
    # Safety: [bed_mesh] måste finnas
    # -------------------------
    {% if 'bed_mesh' not in printer %}
        RESPOND TYPE=error MSG="PRINT_START: [bed_mesh] section is missing in config. Canceling print."
        CANCEL_PRINT
    {% endif %}

    # -------------------------
    # 1) Starta uppvärmning av bädden
    # -------------------------
    M117 Heating bed...
    M140 S{BED}

    G90
    M117 Homing...
    G28

    # -------------------------
    # 2) Vänta tills bädden är i rätt temp
    # -------------------------
    M117 Waiting for bed...
    M190 S{BED}

    # -------------------------
    # 3) Auto adaptive bed mesh (alltid ny, på varm bädd)
    # -------------------------
    M117 Adaptive bed mesh...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    RESPOND MSG="PRINT_START: Adaptive bed mesh complete."

    # -------------------------
    # 4) Lyft nozzle till säker höjd
    # -------------------------
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set safe_z = 5.0 if cur_z < 5.0 else cur_z %}
    {% if safe_z > max_z %}
        {% set safe_z = max_z %}
    {% endif %}
    G1 Z{safe_z} F2000

    # -------------------------
    # 5) Värm hotend till rätt temp
    # -------------------------
    M117 Heating hotend...
    M104 S{HOTEND}
    M109 S{HOTEND}

    # -------------------------
    # 6) Retraction (PA kommer från [extruder])
    # -------------------------
    SET_RETRACTION RETRACT_LENGTH={RET_LEN} RETRACT_SPEED={RET_SPD} UNRETRACT_SPEED={UNRET_SPD}

        # -------------------------
    # 7) Enkel, säker primeline utan krångel
    # -------------------------
    M117 Priming line
    G92 E0
    G1 E1.2 F600    ; <-- NY RAD
    G90

    ; gå upp lite först så vi är säkra
    G1 Z0.5 F1200

    ; första linjen – rejäl, längs framkanten
    G1 X20 Y5 F6000
    G1 X180 Y5 E12 F1500

    ; hoppa upp lite i Y utan att extrudera
    G1 X180 Y10 F6000

    ; andra linjen tillbaka
    G1 X20 Y10 E12 F1500

    ; nolla extruder inför själva printen
    G92 E0

    M117 Printing...

# -------------------------
# Print end for Prusa Mini+
# -------------------------
[gcode_macro PRINT_END]
description: End sequence for Prusa Mini+ with 25mm lift
gcode:
    M400
    G92 E0
    G1 E-2 F1800

    # Calculate safe Z-lift up to 25 mm or max_Z
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set lift = 25.0 %}
    {% if current_z + lift > max_z %}
        {% set target_z = max_z %}
    {% else %}
        {% set target_z = current_z + lift %}
    {% endif %}

    G90
    G1 Z{target_z} F3000

    # Park position – front of the bed
    G1 X10 Y180 F6000

    M106 S0
    TURN_OFF_HEATERS
    BED_MESH_CLEAR

    M117 Print finished

# -------------------------
# Filament change for Prusa Mini+
# -------------------------
[gcode_macro FILAMENT_CHANGE]
description: Filament change for Prusa Mini+ (unload, park, pause)
gcode:
    SAVE_GCODE_STATE NAME=M600_state

    RESPOND MSG="FILAMENT_CHANGE: Starting filament change"

    # Lift Z and park at the front
    G91
    G1 Z10 F600
    G90
    G1 X10 Y180 F6000

    # Full unload – pull out about 380 mm in safe chunks
    RESPOND MSG="FILAMENT_CHANGE: Unloading filament about 380mm"
    G91
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-20 F1500
    G90

    RESPOND MSG="FILAMENT_CHANGE: Remove filament and insert new filament up to the extruder gears. Then run FILAMENT_LOAD."
    PAUSE
    
# Alias so slicer M600 will still work
[gcode_macro M600]
description: Alias to FILAMENT_CHANGE for slicer compatibility
gcode:
    FILAMENT_CHANGE


[gcode_macro FILAMENT_LOAD]
description: Load new filament after FILAMENT_CHANGE/M600
gcode:
    RESPOND MSG="FILAMENT_LOAD: Loading filament about 400mm towards the hotend"

    G91
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E20 F1500    ; extra 20 mm fine adjustment
    G90

    RESPOND MSG="FILAMENT_LOAD: Filament should now be at the hotend. Run FILAMENT_PURGE to purge old color."
    
[gcode_macro FILAMENT_PURGE]
description: Purge old color during filament change
gcode:
    RESPOND MSG="FILAMENT_PURGE: Purging about 40mm filament"
    G91
    G1 E20 F600
    G1 E20 F600
    G90
    
[gcode_macro FILAMENT_RESUME]
description: Resume print after FILAMENT_CHANGE/M600
gcode:
    RESPOND MSG="FILAMENT_RESUME: Resuming print"
    RESTORE_GCODE_STATE NAME=M600_state
    RESUME

# -------------------------
# Simple manual load / unload macros
# -------------------------
[gcode_macro LOAD_FILAMENT]
description: Manually load filament (small amount)
gcode:
    M117 Loading filament...
    G91
    G1 E40 F200
    G1 E40 F150
    G90

[gcode_macro UNLOAD_FILAMENT]
description: Manually unload filament (small amount)
gcode:
    M117 Unloading filament...
    G91
    G1 E-50 F200
    G90
