# ==================================================================================================
# === FILE: macros.cfg
# === PRINTER: Prusa MINI+ Klipper Mod
# === CLEAN VERSION: v1.1
# === NOTE: Print start/end and filament workflow macros.
# ==================================================================================================


# ==================================================================================================
# === MACRO: PRINT_START
# === Version: 2.0
# ==================================================================================================

[gcode_macro PRINT_START]
description: PGe-10 auto-mesh start for Prusa MINI+ with 170C nozzle preheat, adaptive mesh and prime line
gcode:
    # === PARAMETERS ===
    # BED_TEMP och EXTRUDER_TEMP kommer normalt från PrusaSlicer.
    # Nozzle förvärms alltid till 170C under homing och bed mesh.
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set HOTEND = params.EXTRUDER_TEMP|default(220)|float %}
    {% set PREHEAT = 170.0 %}
    {% set RET_LEN = params.RETRACT_LENGTH|default(0.8)|float %}
    {% set RET_SPD = params.RETRACT_SPEED|default(35)|float %}
    {% set UNRET_SPD = params.UNRETRACT_SPEED|default(35)|float %}

    # === CONDITIONS / SAFETY ===
    # PRINT_START kräver att [bed_mesh] finns i Klipper-konfigurationen.
    {% if 'bed_mesh' not in printer %}
        RESPOND TYPE=error MSG="PRINT_START: [bed_mesh] section is missing. Canceling print."
        CANCEL_PRINT
    {% endif %}

    # === ACTIONS: START HEATING ===
    # Starta bed och nozzle samtidigt.
    # Bed värms mot slicerns önskade temperatur, normalt 60C för PLA.
    # Nozzle hålls på 170C tills bed mesh är färdig.
    M117 Preheating...
    M140 S{BED}
    M104 S{PREHEAT}

    # === ACTIONS: HOME ===
    G90
    M117 Homing...
    G28

    # === ACTIONS: WAIT FOR BED ===
    # Vänta tills bädden har nått rätt temperatur innan mesh skapas.
    M117 Waiting for bed...
    M190 S{BED}

    # === ACTIONS: ADAPTIVE BED MESH ===
    # Nozzle fortsätter under tiden att hållas på 170C.
    M117 Adaptive bed mesh...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    RESPOND MSG="PRINT_START: Adaptive bed mesh complete."

    # === ACTIONS: SAFE Z LIFT ===
    # Lyft Z säkert innan nozzle värms till full utskriftstemperatur.
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set safe_z = 5.0 if cur_z < 5.0 else cur_z %}

    {% if safe_z > max_z %}
        {% set safe_z = max_z %}
    {% endif %}

    G1 Z{safe_z} F2000

    # === ACTIONS: FINAL HOTEND TEMPERATURE ===
    # Efter bed mesh går nozzle från 170C till slicerns riktiga
    # första-lager-temperatur.
    M117 Heating hotend...
    M104 S{HOTEND}
    M109 S{HOTEND}

    # === ACTIONS: FIRMWARE RETRACTION ===
    SET_RETRACTION RETRACT_LENGTH={RET_LEN} RETRACT_SPEED={RET_SPD} UNRETRACT_SPEED={UNRET_SPD}

    # === ACTIONS: PRIME LINE ===
    M117 Priming line...
    G92 E0
    G1 E1.2 F600
    G90
    G1 Z0.5 F1200
    G1 X20 Y5 F6000
    G1 X180 Y5 E12 F1500
    G1 X180 Y10 F6000
    G1 X20 Y10 E12 F1500
    G92 E0

    # === NOTES ===
    # Temperatursekvens:
    # 1. Bed -> BED_TEMP från slicern, normalt 60C för PLA
    # 2. Nozzle -> 170C direkt vid PRINT_START
    # 3. Home + Adaptive Bed Mesh
    # 4. Nozzle -> EXTRUDER_TEMP från slicern
    # 5. Prime line
    # 6. Print

    M117 Printing...


# ==================================================================================================
# === MACRO: PRINT_END
# ==================================================================================================

[gcode_macro PRINT_END]
description: End sequence for Prusa MINI+ with safe 25 mm lift
gcode:
    M400
    G92 E0
    G1 E-2 F1800

    # === Calculate safe Z lift without exceeding max Z
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set lift = 25.0 %}
    {% if current_z + lift > max_z %}
        {% set target_z = max_z %}
    {% else %}
        {% set target_z = current_z + lift %}
    {% endif %}

    G90
    G1 Z{target_z} F3000
    G1 X10 Y180 F6000

    M106 S0
    TURN_OFF_HEATERS
    BED_MESH_CLEAR

    M117 Print finished


# ==================================================================================================
# === FILAMENT CHANGE WORKFLOW: M600
# ==================================================================================================

[gcode_macro FILAMENT_CHANGE]
description: Filament change for Prusa MINI+; unload, park and pause
gcode:
    SAVE_GCODE_STATE NAME=M600_state

    RESPOND MSG="FILAMENT_CHANGE: Starting filament change."

    G91
    G1 Z10 F600
    G90
    G1 X10 Y180 F6000

    RESPOND MSG="FILAMENT_CHANGE: Unloading filament about 380 mm."
    G91
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-20 F1500
    G90

    RESPOND MSG="FILAMENT_CHANGE: Insert new filament to extruder gears, then run FILAMENT_LOAD."
    PAUSE

[gcode_macro M600]
description: Alias to FILAMENT_CHANGE for slicer compatibility
gcode:
    FILAMENT_CHANGE

[gcode_macro FILAMENT_LOAD]
description: Load new filament after FILAMENT_CHANGE/M600
gcode:
    RESPOND MSG="FILAMENT_LOAD: Loading filament about 380 mm toward hotend."
    G91
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E20 F1500
    G90
    RESPOND MSG="FILAMENT_LOAD: Run FILAMENT_PURGE until color is clean, then FILAMENT_RESUME."

[gcode_macro FILAMENT_PURGE]
description: Purge old color during filament change
gcode:
    RESPOND MSG="FILAMENT_PURGE: Purging about 40 mm filament."
    G91
    G1 E20 F600
    G1 E20 F600
    G90

[gcode_macro FILAMENT_RESUME]
description: Resume print after FILAMENT_CHANGE/M600
gcode:
    RESPOND MSG="FILAMENT_RESUME: Restoring state and resuming print."
    RESTORE_GCODE_STATE NAME=M600_state
    RESUME


# ==================================================================================================
# === FILAMENT: SIMPLE MANUAL LOAD / UNLOAD
# ==================================================================================================

[gcode_macro LOAD_FILAMENT]
description: Manually load filament; small amount
gcode:
    M117 Loading filament...
    G91
    G1 E40 F200
    G1 E40 F150
    G90

[gcode_macro UNLOAD_FILAMENT]
description: Manually unload filament; small amount
gcode:
    M117 Unloading filament...
    G91
    G1 E-50 F200
    G90
