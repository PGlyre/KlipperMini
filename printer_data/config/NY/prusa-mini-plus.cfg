###
# Cheat sheet:
# - Motion steppers (X/Y/Z) for Prusa Mini+
# - Extruder (IFS / stock) configuration
# - Heaters, fans, and sensors
# - Probe (SuperPINDA) and bed mesh references
# - Display / LEDs / miscellaneous hardware pins
###

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0.0
unretract_speed: 35

[stepper_x]
step_pin: PD1
dir_pin: PD0
enable_pin: !PD3
microsteps: 16
rotation_distance: 32  # 200 * 16 / 100
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 180
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: PD13
dir_pin: PD12
enable_pin: !PD14
microsteps: 16
rotation_distance: 32  # 200 * 16 / 100
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -3
position_min: -3
position_max: 180
homing_speed: 50
homing_retract_dist: 0

[stepper_z]
step_pin: PD4
dir_pin: !PD15
enable_pin: !PD2
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -1
position_max: 180
homing_speed: 8
second_homing_speed: 3

[extruder]
step_pin: PC15
dir_pin: !PC14
enable_pin: !PC13
microsteps: 16
rotation_distance: 22.832  # example
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PB3
sensor_pin: PA1
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 275
pressure_advance: 0.04

[heater_bed]
heater_pin: PB4
sensor_pin: PA0
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 120

[probe]
pin: ^PC4
x_offset: -25
y_offset: -5
z_offset: 0.0
speed: 5
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.03
samples_tolerance_retries: 3

[fan]
pin: PB5

[heater_fan hotend_fan]
pin: PB6
heater: extruder
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.3

[tmc2209 stepper_x]
uart_pin: PE3
run_current: 0.5
hold_current: 0.25
interpolate: True
diag_pin: ^PC2
driver_SGTHRS: 60

[tmc2209 stepper_y]
uart_pin: PE4
run_current: 0.5
hold_current: 0.25
interpolate: True
diag_pin: ^PC3
driver_SGTHRS: 60

[tmc2209 stepper_z]
uart_pin: PE5
run_current: 0.5
hold_current: 0.25
interpolate: True

[tmc2209 extruder]
uart_pin: PE6
run_current: 0.5
hold_current: 0.25
interpolate: True