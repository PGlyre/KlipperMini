# ================================
#   BME280 Chamber Temperature
#   Custom I2C bus (software I2C)
#   SDA = GPIO5 (pin 29)
#   SCL = GPIO6 (pin 31)
#   VCC = 3.3V, GND = GND
# ================================

# Software I2C bus on Raspberry Pi GPIO
[software_i2c bme_bus]
i2c_mcu: rpi
sda_pin: rpi:gpio5
scl_pin: rpi:gpio6
speed: 400000

# BME280 temperature sensor
[temperature_sensor chamber_temp]
sensor_type: BME280
i2c_mcu: rpi
i2c_bus: bme_bus
# i2c_address: 118        # Uncomment only if your board uses 0x76 instead of 0x77
min_temp: 0
max_temp: 80
gcode_id: CHAMBER

# Optional: filter temperature noise slightly
# smooth_time: 0.5

