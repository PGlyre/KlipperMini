[mcu rpi] # Not needed if used before
serial: /tmp/klipper_host_mcu 

[temperature_sensor chamber_temp]
sensor_type: BME280
i2c_mcu: rpi
i2c_bus: bme_bus
# i2c_address: 118     # bara om du behöver 0x76 vs 0x77
min_temp: 0
max_temp: 80
gcode_id: CHAMBER

