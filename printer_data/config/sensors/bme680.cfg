# [temperature_sensor chamber_temp]
# sensor_type: BME280
# i2c_mcu: rpi
# i2c_bus: i2c.3              # (or i2c.1 if using default pins)
# i2c_address: 119            # use 119 for 0x77, use 118 for 0x76
# min_temp: 0
# max_temp: 80

# BME680 (Klipper uses the bme280 driver for BME680 too)
[bme280 chamber_temp]
i2c_mcu: rpi
i2c_bus: i2c.1
i2c_address: 0x77

