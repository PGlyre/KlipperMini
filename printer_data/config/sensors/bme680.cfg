# # ============================================
# #  BME280 Chamber Temperature Sensor
# #  Adafruit BME280 (I2C)
# #  Connected to Raspberry Pi MCU
# # ============================================

# [temperature_sensor chamber_temp]
# sensor_type: BME280

# # MCU to read the sensor
# i2c_mcu: rpi

# # --------------------------------------------
# # Which I2C bus?
# # • If using standard pins (GPIO2=SDA, GPIO3=SCL)
# #       use: i2c_bus: i2c.1
# # • If using alternative bus (RPi I2C-3 workaround)
# #       use: i2c_bus: i2c.3
# #
# # Set this according to your wiring
# # --------------------------------------------
# i2c_bus: i2c.1

# # --------------------------------------------
# # Sensor I2C address:
# # • 119 = 0x77  (SDO = HIGH or unconnected – Adafruit default)
# # • 118 = 0x76  (SDO = LOW)
# #
# # Your i2cdetect read: 0x77
# # --------------------------------------------
# i2c_address: 119

# # --------------------------------------------
# # Safety limits
# # --------------------------------------------
# min_temp: -10
# max_temp: 80
