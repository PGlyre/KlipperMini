# =========================================
#  Dual ADXL345 (X & Y) – Raspberry Pi 4
#  För KlipperMini / Prusa Mini
# =========================================

[mcu rpi]
serial: /tmp/klipper_host_mcu

# -------------------------------
#  X-axel – accelerometer på hotend / X-vagn
# -------------------------------
[adxl345 hotend_accel]
cs_pin: rpi:gpio8          # CS0 – Pin 24 på RPi
spi_bus: spidev0.0
spi_speed: 5000000         # 5 MHz, funkar oftast bra
axes_map: x,y,z            # Justeras om sensorn är vriden

# -------------------------------
#  Y-axel – accelerometer på bädd / Y-vagn
# -------------------------------
[adxl345 bed_accel]
cs_pin: rpi:gpio7          # CS1 – Pin 26 på RPi
spi_bus: spidev0.1
spi_speed: 5000000
axes_map: x,y,z            # Justeras vid behov

# -------------------------------
#  Resonance tester – använder båda sensorerna
# -------------------------------
[resonance_tester]
# Vilken sensor som används för vilken axel:
accel_chip_x: adxl345 hotend_accel
accel_chip_y: adxl345 bed_accel

probe_points:
    90, 90, 10             # Mitt på Prusa Mini-bädden
min_freq: 5
max_freq: 133
accel_per_hz: 50
hz_per_sec: 1