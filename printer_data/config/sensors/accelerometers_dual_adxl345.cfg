# =========================================
#  ENKEL ADXL345 – Raspberry Pi 4
#  (Rekommenderad standardsetup)
# =========================================

[adxl345]
cs_pin: rpi:None          # Låt Linux SPI driva CS
spi_bus: spidev0.0        # SPI0 på RPi
spi_speed: 5000000
axes_map: x,y,z           # Justera om sensorn är vriden

[resonance_tester]
accel_chip: adxl345
probe_points:
    90, 90, 10            # Mitt på Prusa Mini-bädden
min_freq: 5
max_freq: 133
accel_per_hz: 50
hz_per_sec: 1