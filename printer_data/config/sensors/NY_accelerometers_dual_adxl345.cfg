# =========================================
# accelerometers_dual_adxl345.cfg
# =========================================
# Cheat sheet:
# - Configures a single ADXL345 connected to Raspberry Pi 4 SPI0
# - Used for resonance testing and input shaper calibration
# - Call SHAPER_CALIBRATE (see resonance_tuning.cfg) to use it
# =========================================

[adxl345]
cs_pin: rpi:None          # Let Linux SPI drive chip select
spi_bus: spidev0.0        # SPI0 on Raspberry Pi
spi_speed: 5000000
axes_map: x,y,z           # Adjust if the sensor is rotated

[resonance_tester]
accel_chip: adxl345
probe_points:
    90, 90, 10            # Center of the Prusa Mini bed
min_freq: 5
max_freq: 133
accel_per_hz: 50
hz_per_sec: 1