# =========================================
#  Single ADXL345 – Raspberry Pi 4
#  (Recommended default setup)
# =========================================

[adxl345]
cs_pin: rpi:None          # Let Linux SPI drive CS
spi_bus: spidev0.0        # SPI0 on Raspberry Pi
spi_speed: 5000000
axes_map: x,y,z           # Adjust if the sensor is rotated

[resonance_tester]
accel_chip: adxl345
probe_points:
    90, 90, 10            # Center of the Prusa Mini bed
min_freq: 5
max_freq: 133
accel_per_hz: 50
hz_per_sec: 1