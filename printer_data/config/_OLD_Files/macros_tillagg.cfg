# [gcode_macro PRINT_START]
# description: Start sequence for Prusa Mini+ (heat, adaptive mesh, prime line, PA, retraction)
# variable_bed_temp: 60
# variable_extruder_temp: 220
# variable_pa: 0.04
# variable_retract_length: 0.8
# variable_retract_speed: 35
# variable_unretract_speed: 35
# gcode:
#     {% set BED = params.BED_TEMP|default(printer["gcode_macro PRINT_START"].variable_bed_temp)|float %}
#     {% set HOTEND = params.EXTRUDER_TEMP|default(printer["gcode_macro PRINT_START"].variable_extruder_temp)|float %}
#     {% set PA = params.PA|default(printer["gcode_macro PRINT_START"].variable_pa)|float %}
#     {% set RET_LEN = params.RETRACT_LENGTH|default(printer["gcode_macro PRINT_START"].variable_retract_length)|float %}
#     {% set RET_SPD = params.RETRACT_SPEED|default(printer["gcode_macro PRINT_START"].variable_retract_speed)|float %}
#     {% set UNRET_SPD = params.UNRETRACT_SPEED|default(printer["gcode_macro PRINT_START"].variable_unretract_speed)|float %}

#     # -------------------------
#     # Heat bed and hotend
#     # -------------------------
#     M117 Heating bed & hotend
#     M140 S{BED}
#     M104 S{HOTEND}

#     G90
#     G28

#     # -------------------------
#     # Adaptive Bed Mesh
#     # Requires the slicer to send min/max X/Y
#     # via SET_PRINT_MIN / SET_PRINT_MAX i start-gcode
#     # -------------------------
#     BED_MESH_CLEAR
#     BED_MESH_CALIBRATE ADAPTIVE=1

#     # Wait until everything is at temperature before printing
#     M190 S{BED}
#     M109 S{HOTEND}

#     # -------------------------
#     # Pressure advance & retraction
#     # -------------------------
#     SET_PRESSURE_ADVANCE ADVANCE={PA}
#     SET_RETRACTION RETRACT_LENGTH={RET_LEN} RETRACT_SPEED={RET_SPD} UNRETRACT_SPEED={UNRET_SPD}

#     # -------------------------
#     # Prime line along the front edge
#     # -------------------------
#     M117 Priming line
#     G92 E0
#     G1 X20 Y5 Z0.3 F1000
#     G1 X180 Y5 Z0.3 E10 F1200
#     G1 X180 Y10 Z0.3 F6000
#     G1 X20 Y10 Z0.3 E10 F1200
#     G92 E0

#     M117 Printing...


[gcode_macro PRINT_START_PLA]
description: Start print with PLA defaults (Prusa Mini+)
gcode:
    # Typical PLA: 60°C bed, 215°C nozzle, PA ~0.04
    PRINT_START BED_TEMP=60 EXTRUDER_TEMP=215 PA=0.04

[gcode_macro PRINT_START_PETG]
description: Start print with PETG defaults (Prusa Mini+)
gcode:
    # Typical PETG: 80°C bed, 240°C nozzle, PA ~0.06
    PRINT_START BED_TEMP=80 EXTRUDER_TEMP=240 PA=0.06

[gcode_macro PRINT_START_TPU]
description: Start print with TPU defaults (Prusa Mini+)
gcode:
    # Example TPU: lower speed, different PA if you like
    PRINT_START BED_TEMP=50 EXTRUDER_TEMP=225 PA=0.03

[gcode_macro PRINT_START_ASA]
description: Start print with ASA defaults (Prusa Mini+)
gcode:
    # Example TPU: lower speed, different PA if you like
    PRINT_START BED_TEMP=100 EXTRUDER_TEMP=250 PA=0.08