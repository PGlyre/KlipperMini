# ===============================
#  ACCELEROMETERS (X & Y)
# ===============================

# --- X-accelerometer (t.ex. på hotend / X-vagn) ---
[adxl345 hotend_accel]
cs_pin: rpi:gpio8
spi_bus: spidev0.0
axes_map: x,y,z     # ändra vid behov

# --- Y-accelerometer (t.ex. på bädden / Y-axeln) ---
[adxl345 bed_accel]
cs_pin: rpi:gpio7
spi_bus: spidev0.1
axes_map: x,y,z     # ändra vid behov

# --- Resonance tester ---
[resonance_tester]
accel_chip_x: adxl345 hotend_accel
accel_chip_y: adxl345 bed_accel
probe_points:
    90, 90, 10      # centrum på Prusa Mini bädd