# macros.cfg
# Custom macros for Prusa Mini+ with Klipper / KlipperMini
# All texts are in English only.

[gcode_macro PRINT_START]
description: Start sequence for Prusa Mini+ (heat, adaptive mesh, prime line, PA, retraction)
variable_bed_temp: 60
variable_extruder_temp: 220
variable_pa: 0.04
variable_retract_length: 0.8
variable_retract_speed: 35
variable_unretract_speed: 35
gcode:
    {% set BED = params.BED_TEMP|default(printer["gcode_macro PRINT_START"].variable_bed_temp)|float %}
    {% set HOTEND = params.EXTRUDER_TEMP|default(printer["gcode_macro PRINT_START"].variable_extruder_temp)|float %}
    {% set PA = params.PA|default(printer["gcode_macro PRINT_START"].variable_pa)|float %}
    {% set RET_LEN = params.RETRACT_LENGTH|default(printer["gcode_macro PRINT_START"].variable_retract_length)|float %}
    {% set RET_SPD = params.RETRACT_SPEED|default(printer["gcode_macro PRINT_START"].variable_retract_speed)|float %}
    {% set UNRET_SPD = params.UNRETRACT_SPEED|default(printer["gcode_macro PRINT_START"].variable_unretract_speed)|float %}

    # -------------------------
    # Heat bed and hotend
    # -------------------------
    M117 Heating bed & hotend
    M140 S{BED}
    M104 S{HOTEND}

    G90
    G28

    # -------------------------
    # Adaptive Bed Mesh
    # Kräver att slicern skickar min/max X/Y
    # via SET_PRINT_MIN / SET_PRINT_MAX i start-gcode
    # -------------------------
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Vänta tills allt är varmt innan utskrift
    M190 S{BED}
    M109 S{HOTEND}

    # -------------------------
    # Pressure advance & retraction
    # -------------------------
    SET_PRESSURE_ADVANCE ADVANCE={PA}
    SET_RETRACTION RETRACT_LENGTH={RET_LEN} RETRACT_SPEED={RET_SPD} UNRETRACT_SPEED={UNRET_SPD}

    # -------------------------
    # Prime line längs framkant
    # -------------------------
    M117 Priming line
    G92 E0
    G1 X20 Y5 Z0.3 F1000
    G1 X180 Y5 Z0.3 E10 F1200
    G1 X180 Y10 Z0.3 F6000
    G1 X20 Y10 Z0.3 E10 F1200
    G92 E0

    M117 Printing...

# -------------------------
# Print end for Prusa Mini+
# -------------------------

[gcode_macro PRINT_END]
description: End sequence for Prusa Mini+ with 25mm lift
gcode:
    M400
    G92 E0
    G1 E-2 F1800

    # Beräkna säker Z-lyft upp till 25 mm eller max_Z
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set lift = 25.0 %}
    {% if current_z + lift > max_z %}
        {% set target_z = max_z %}
    {% else %}
        {% set target_z = current_z + lift %}
    {% endif %}

    G90
    G1 Z{target_z} F3000

    # Park position – fram på bädden
    G1 X10 Y180 F6000

    M106 S0
    TURN_OFF_HEATERS
    BED_MESH_CLEAR

    M117 Print finished

# -------------------------
# Filament change for Prusa Mini+
# -------------------------

[gcode_macro FILAMENT_CHANGE]
description: Filament change for Prusa Mini+ (unload, park, pause)
gcode:
    SAVE_GCODE_STATE NAME=M600_state

    RESPOND MSG="FILAMENT_CHANGE: Starting filament change"

    # Lift Z and park at the front
    G91
    G1 Z10 F600
    G90
    G1 X10 Y180 F6000

    # Full unload – pull out about 380 mm in safe chunks
    RESPOND MSG="FILAMENT_CHANGE: Unloading filament about 380mm"
    G91
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-40 F1500
    G1 E-20 F1500
    G90

    RESPOND MSG="FILAMENT_CHANGE: Remove filament and insert new filament up to the extruder gears. Then run FILAMENT_LOAD."
    PAUSE
    
# Alias so slicer M600 will still work
[gcode_macro M600]
description: Alias to FILAMENT_CHANGE for slicer compatibility
gcode:
    FILAMENT_CHANGE


[gcode_macro FILAMENT_LOAD]
description: Load new filament after FILAMENT_CHANGE/M600
gcode:
    RESPOND MSG="FILAMENT_LOAD: Loading filament about 400mm towards the hotend"

    G91
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E40 F1500
    G1 E20 F1500    ; extra 20 mm fine adjustment
    G90

    RESPOND MSG="FILAMENT_LOAD: Filament should now be at the hotend. Run FILAMENT_PURGE to purge old color."
    
[gcode_macro FILAMENT_PURGE]
description: Purge old color during filament change
gcode:
    RESPOND MSG="FILAMENT_PURGE: Purging about 40mm filament"
    G91
    G1 E20 F600
    G1 E20 F600
    G90
    
[gcode_macro FILAMENT_RESUME]
description: Resume print after FILAMENT_CHANGE/M600
gcode:
    RESPOND MSG="FILAMENT_RESUME: Resuming print"
    RESTORE_GCODE_STATE NAME=M600_state
    RESUME


# -------------------------
# Simple manual load / unload macros
# -------------------------

[gcode_macro LOAD_FILAMENT]
description: Manually load filament (small amount)
gcode:
    M117 Loading filament...
    G91
    G1 E40 F200
    G1 E40 F150
    G90

[gcode_macro UNLOAD_FILAMENT]
description: Manually unload filament (small amount)
gcode:
    M117 Unloading filament...
    G91
    G1 E-50 F200
    G90