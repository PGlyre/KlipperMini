# ============================================================
# bed_mesh.cfg – Prusa Mini+ (approx. 180 x 180 mm build area)
#
# Notes:
# - mesh_min / mesh_max define the probed area in X/Y
# - zero_reference_position should be near the physical center
# - All values are unchanged from your original configuration
# ============================================================

[bed_mesh]
speed: 120
horizontal_move_z: 3
mesh_min: 30, 20
mesh_max: 150, 170
probe_count: 5, 5
fade_start: 0.3
fade_end: 5.0
algorithm: bicubic
zero_reference_position: 90, 90