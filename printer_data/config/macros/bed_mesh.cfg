# bed_mesh.cfg – for Prusa Mini+ 180x180
# Cheat sheet:
# - Defines one general bed_mesh for the Prusa Mini+ (≈180 x 180 mm bed)
# - Adjust mesh_min / mesh_max if you change probe offsets or bed size
# - zero_reference_position should be near the physical center of the bed

[bed_mesh]
speed: 120
horizontal_move_z: 3
mesh_min: 30, 20
mesh_max: 150, 170     
probe_count: 5, 5      
fade_start: 0.3
fade_end: 5.0
algorithm: bicubic
zero_reference_position: 90,90