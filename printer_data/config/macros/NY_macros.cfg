# macros.cfg
# Custom macros for Prusa Mini+ with Klipper / KlipperMini
# All texts are in English only.

[gcode_macro PRINT_START]
description: PGe10 auto-mesh start for Prusa Mini+ (adaptive mesh + primeline)
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set HOTEND = params.EXTRUDER_TEMP|default(220)|float %}
    {% set RET_LEN = params.RETRACT_LENGTH|default(0.8)|float %}
    {% set RET_SPD = params.RETRACT_SPEED|default(35)|float %}
    {% set UNRET_SPD = params.UNRETRACT_SPEED|default(35)|float %}

    # -------------------------
    # Safety: [bed_mesh] section must exist
    # -------------------------
    {% if printer.bed_mesh is not defined %}
        RESPOND PREFIX="error" MSG="[bed_mesh] is not configured – aborting PRINT_START"
        CANCEL_PRINT
        RETURN
    {% endif %}

    # -------------------------
    # 1) Start bed heating
    # -------------------------
    M117 Heating bed...
    M140 S{BED}

    # -------------------------
    # 2) Wait until the bed reaches target temperature
    # -------------------------
    M190 S{BED}

    # -------------------------
    # 3) Auto adaptive bed mesh (always new, on a hot bed)
    # -------------------------
    SAFE_LOAD_MESH

    # -------------------------
    # 4) Raise the nozzle to a safe height
    # -------------------------
    G90
    G1 Z10 F6000

    # -------------------------
    # 5) Heat the hotend to the target temperature
    # -------------------------
    M117 Heating hotend...
    M109 S{HOTEND}

    # -------------------------
    # 6) Retraction (pressure advance comes from [extruder])
    # -------------------------
    SET_RETRACTION RETRACT_LENGTH={RET_LEN} RETRACT_SPEED={RET_SPD} UNRETRACT_SPEED={UNRET_SPD}

    # -------------------------
    # 7) Simple, safe primeline without hassle
    # -------------------------
    PRIME_LINE

    M117 Printing...

[gcode_macro PRIME_LINE]
description: Prime line along the front edge of the bed
gcode:
    G90
    G92 E0
    G1 Z0.28 F6000
    ; move up a little first to be safe
    G1 Z0.4 F6000
    ; first line – solid, along the front edge
    G1 X15 Y10 F6000
    G1 Z0.28 F600
    G1 X165 Y10 E15 F800
    G1 X165.5 Y10.5 F6000
    G1 Z0.4 F6000
    ; reset extruder position before the actual print
    G92 E0

[gcode_macro PRINT_END]
description: Safe print end for Prusa Mini+
gcode:
    G91
    G1 E-2 F2100
    G1 Z+10 F600
    G90
    G1 X180 Y180 F6000
    M104 S0
    M140 S0
    M107
    M84

[gcode_macro FILAMENT_LOAD]
description: Load filament (to nozzle) with extra purge
gcode:
    M117 Loading filament...
    G91
    G1 E40 F200
    G1 E40 F150
    G1 E20 F100
    G90

[gcode_macro FILAMENT_UNLOAD]
description: Unload filament (complete)
gcode:
    M117 Unloading filament...
    G91
    G1 E-80 F200
    G90

[gcode_macro FILAMENT_PURGE]
description: Purge filament at nozzle
gcode:
    M117 Purging filament...
    G91
    G1 E10 F150
    G1 E10 F120
    G90

[gcode_macro LOAD_FILAMENT]
description: Manually load filament (small amount)
gcode:
    M117 Loading filament...
    G91
    G1 E40 F200
    G1 E40 F150
    G90

[gcode_macro UNLOAD_FILAMENT]
description: Manually unload filament (small amount)
gcode:
    M117 Unloading filament...
    G91
    G1 E-50 F200
    G90