# =========================================
#  Makron för Input Shaper / Resonans-tuning
# =========================================

[gcode_macro SHAPER_TEST_X]
description: Kör full shaper-mätning på X-axeln (med X-accelerometern)
gcode:
    # Hemma först för säkerhet
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Startar SHAPER_CALIBRATE för X-axeln..."
    SHAPER_CALIBRATE AXIS=X

[gcode_macro SHAPER_TEST_Y]
description: Kör full shaper-mätning på Y-axeln (med Y-accelerometern)
gcode:
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Startar SHAPER_CALIBRATE för Y-axeln..."
    SHAPER_CALIBRATE AXIS=Y

[gcode_macro SHAPER_TEST_BOTH]
description: Kör X + Y shaper-mätning efter varandra
gcode:
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Startar SHAPER_CALIBRATE för X-axeln..."
    SHAPER_CALIBRATE AXIS=X
    RESPOND PREFIX="info" MSG="Startar SHAPER_CALIBRATE för Y-axeln..."
    SHAPER_CALIBRATE AXIS=Y
    RESPOND PREFIX="info" MSG="Klar! Kör SAVE_CONFIG om du är nöjd med förslagen."