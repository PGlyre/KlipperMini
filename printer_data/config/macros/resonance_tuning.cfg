# === NOTE: Helper macros for input shaper / resonance calibration.
# ==================================================================================================

[gcode_macro SHAPER_TEST_X]
description: Run full shaper calibration on X axis
gcode:
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Starting SHAPER_CALIBRATE for X axis..."
    SHAPER_CALIBRATE AXIS=X

[gcode_macro SHAPER_TEST_Y]
description: Run full shaper calibration on Y axis
gcode:
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Starting SHAPER_CALIBRATE for Y axis..."
    SHAPER_CALIBRATE AXIS=Y

[gcode_macro SHAPER_TEST_BOTH]
description: Run X and Y shaper calibration sequentially
gcode:
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Starting SHAPER_CALIBRATE for X axis..."
    SHAPER_CALIBRATE AXIS=X
    RESPOND PREFIX="info" MSG="Starting SHAPER_CALIBRATE for Y axis..."
    SHAPER_CALIBRATE AXIS=Y
    RESPOND PREFIX="info" MSG="Done. Run SAVE_CONFIG if you are satisfied with the results."
