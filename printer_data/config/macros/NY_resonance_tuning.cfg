# =========================================
# resonance_tuning.cfg
# =========================================
# Cheat sheet:
# - SHAPER_TEST_X  : run SHAPER_CALIBRATE for X axis
# - SHAPER_TEST_Y  : run SHAPER_CALIBRATE for Y axis
# - SHAPER_TEST_BOTH: run X then Y in sequence
# - Make sure ADXL345 is configured (see accelerometers_dual_adxl345.cfg)
# =========================================

[gcode_macro SHAPER_TEST_X]
description: Run full SHAPER_CALIBRATE on X axis (with X accelerometer)
gcode:
    # Home first for safety
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Starting SHAPER_CALIBRATE for X axis..."
    SHAPER_CALIBRATE AXIS=X

[gcode_macro SHAPER_TEST_Y]
description: Run full SHAPER_CALIBRATE on Y axis (with Y accelerometer)
gcode:
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Starting SHAPER_CALIBRATE for Y axis..."
    SHAPER_CALIBRATE AXIS=Y

[gcode_macro SHAPER_TEST_BOTH]
description: Run SHAPER_CALIBRATE for X and then Y
gcode:
    G28
    G90
    G1 X90 Y90 Z10 F6000
    RESPOND PREFIX="info" MSG="Starting SHAPER_CALIBRATE for X axis..."
    SHAPER_CALIBRATE AXIS=X
    RESPOND PREFIX="info" MSG="Starting SHAPER_CALIBRATE for Y axis..."
    SHAPER_CALIBRATE AXIS=Y
    RESPOND PREFIX="info" MSG="Done! Run SAVE_CONFIG if you are happy with the suggested values."