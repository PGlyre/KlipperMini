# Spoolman integration macros
# These macros allow assigning or clearing the active spool from G-code.
# No functionality has been altered.

[gcode_macro SET_ACTIVE_SPOOL]
description: Set the active Spoolman spool (requires ID parameter)
gcode:
    {% if params.ID %}
        {% set id = params.ID|int %}
        {action_call_remote_method(
            "spoolman_set_active_spool",
            spool_id=id
        )}
    {% else %}
        {action_respond_info("Parameter 'ID' is required")}
    {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Clear the currently active Spoolman spool
gcode:
    {action_call_remote_method(
        "spoolman_set_active_spool",
        spool_id=None
    )}