# custom_macros.cfg

[gcode_macro SAFE_LOAD_MESH]
description: Load a BED_MESH profile or calibrate and save if missing
# Usage: SAFE_LOAD_MESH PROFILE=<profile_name>
variable_mesh: "mini_mesh"
gcode:
    {% set NAME = params.PROFILE|default(printer["gcode_macro SAFE_LOAD_MESH"].variable_mesh)|string %}

    {% if printer.bed_mesh is not defined %}
        RESPOND MSG="BED_MESH module not configured in printer.cfg — skipping mesh."
        RETURN
    {% endif %}

    {% set profiles = printer.bed_mesh.profiles %}
    {% if profiles is defined and (NAME in profiles) %}
        RESPOND MSG="Loading BED_MESH profile '{NAME}'."
        BED_MESH_PROFILE LOAD={NAME}
    {% else %}
        RESPOND MSG="Profile '{NAME}' not found. Probing and saving as new BED_MESH profile."
        BED_MESH_CALIBRATE
        BED_MESH_PROFILE SAVE={NAME}
        SAVE_CONFIG
    {% endif %}

[gcode_macro USE_MINI_MESH]
description: Load mesh profile 'mini_mesh' via SAFE_LOAD_MESH
gcode:
    SAFE_LOAD_MESH PROFILE="mini_mesh"

[gcode_macro BED_MESH_MINI]
description: Shorthand for BED_MESH_CALIBRATE + SAVE_CONFIG to 'mini_mesh'
gcode:
    RESPOND MSG="Running BED_MESH_CALIBRATE for 'mini_mesh' and saving..."
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE="mini_mesh"
    SAVE_CONFIG

