# ================================================================
# custom_macros.cfg
# Additional custom macros for Prusa Mini+ (Klipper / KlipperMini)
# ================================================================

# ----------------------------------------------------------------
# SAFE_LOAD_MESH
# Load a BED_MESH profile. If it does not exist, calibrate and save.
# Usage:
#   SAFE_LOAD_MESH PROFILE=<profile_name>
# Default profile:
#   mini_mesh
# ----------------------------------------------------------------
[gcode_macro SAFE_LOAD_MESH]
description: Load a BED_MESH profile or calibrate + save if missing
variable_mesh: "mini_mesh"
gcode:
    {% set NAME = params.PROFILE|default(printer["gcode_macro SAFE_LOAD_MESH"].variable_mesh)|string %}

    # Ensure bed_mesh module exists
    {% if printer.bed_mesh is not defined %}
        RESPOND MSG="SAFE_LOAD_MESH: [bed_mesh] module not found — skipping mesh."
        RETURN
    {% endif %}

    # Check if profile exists
    {% set profiles = printer.bed_mesh.profiles %}
    {% if profiles is defined and (NAME in profiles) %}
        RESPOND MSG="SAFE_LOAD_MESH: Loading existing mesh profile '{NAME}'"
        BED_MESH_PROFILE LOAD={NAME}
    {% else %}
        RESPOND MSG="SAFE_LOAD_MESH: Profile '{NAME}' missing — running calibration."
        BED_MESH_CLEAR
        BED_MESH_CALIBRATE PROFILE={NAME}
        BED_MESH_PROFILE SAVE={NAME}
        BED_MESH_PROFILE LOAD={NAME}
    {% endif %}

# ----------------------------------------------------------------
# Git update helper macros (Klipper-backup)
# ----------------------------------------------------------------
[gcode_macro update_git]
description: Run the Klipper-backup script with optional MESSAGE
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

[gcode_macro SET_CHAMBER_HEATER]
gcode:
    {% set t = params.T|default(0)|float %}
    {action_respond_info("// Set chamber heater to: " ~ t)}

[gcode_macro CHAMBER_HEATER_OFF]
gcode:
    {action_respond_info("// Set chamber heater to: 0")}

[gcode_macro CHAMBER_QUERY]
gcode:
    {action_call_remote_method("machine.device_power.get_device",
       device="esp32_chamber_heater")}

