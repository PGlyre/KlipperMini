# ==================================================================================================
# === MACRO: SAFE_LOAD_MESH
# === Loads existing mesh profile, or calibrates/saves if missing.
# ==================================================================================================

[gcode_macro SAFE_LOAD_MESH]
description: Load a BED_MESH profile or calibrate and save if missing
variable_mesh: "mini_mesh"
gcode:
    {% set NAME = params.PROFILE|default(printer["gcode_macro SAFE_LOAD_MESH"].variable_mesh)|string %}

    {% if printer.bed_mesh is not defined %}
        RESPOND MSG="SAFE_LOAD_MESH: [bed_mesh] module not found — skipping mesh."
        RETURN
    {% endif %}

    {% set profiles = printer.bed_mesh.profiles %}
    {% if profiles is defined and (NAME in profiles) %}
        RESPOND MSG="SAFE_LOAD_MESH: Loading existing mesh profile '{NAME}'."
        BED_MESH_PROFILE LOAD={NAME}
    {% else %}
        RESPOND MSG="SAFE_LOAD_MESH: Profile '{NAME}' missing — running calibration."
        BED_MESH_CLEAR
        BED_MESH_CALIBRATE PROFILE={NAME}
        BED_MESH_PROFILE SAVE={NAME}
        BED_MESH_PROFILE LOAD={NAME}
    {% endif %}


# ==================================================================================================
# === CHAMBER HEATER PLACEHOLDER MACROS
# === These talk to / represent your external ESP32 chamber heater workflow.
# ==================================================================================================

[gcode_macro SET_CHAMBER_HEATER]
description: Set external chamber heater target
gcode:
    {% set T = params.T|default(40.0)|float %}
    M118 // Set chamber heater to: {T}

[gcode_macro CHAMBER_HEATER_OFF]
description: Turn external chamber heater off
gcode:
    {action_respond_info("// Set chamber heater to: 0")}

[gcode_macro CHAMBER_QUERY]
description: Query external chamber heater power device through Moonraker
gcode:
    {action_call_remote_method("machine.device_power.get_device",
       device="esp32_chamber_heater")}
