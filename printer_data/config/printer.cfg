# printer.cfg – Prusa Mini+ med keenzkustoms/klippermini
# PGe-10 edition 😎

# 1) Den här raden drar in själva Mini+-konfigurationen från keenzkustoms.
#    Klona repo:t på Pi:n, t.ex. till /home/pi/klippermini
#    och justera sökvägen nedan om du lagt det någon annanstans.
#[include /home/pi/klippermini/config/printer-prusa-mini-plus-2020.cfg]
[include prusa-mini-plus.cfg]
[include shell_command.cfg]

# 2) Våra egna filer (de skrivs inte över av uppdateringar)
[include mainsail.cfg]
[include macros.cfg]
#[include xxx.cfg]
[include spoolman.cfg]
[include bed_mesh.cfg]
#[include xxx.cfg]
#[include xxx.cfg]
#[include xxx.cfg]

# 3) MCU – fyll i din egen serial
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_prusa-buddy-if00
# Hitta den via:  ls /dev/serial/by-id/  i SSH
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0

# Mini är 180x180, men keenzkustoms-filen ovan sätter redan rätt värden
# så vi behöver oftast inte ange position_max här.

[gcode_arcs]
resolution: 0.1

# Virtuellt SD – behövs för Mainsail/Moonraker
[virtual_sdcard]
path: ~/printer_data/gcodes

[temperature_sensor Buddy]
sensor_type: temperature_mcu

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 1
max_temp: 100

#############################################################################################################
### FILAMENT SENSOR
#############################################################################################################
[filament_switch_sensor toolhead_filament_sensor_t0]
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.01
switch_pin: ^PB4
runout_gcode:
	_ON_TOOLHEAD_FILAMENT_SENSOR_RUNOUT TOOLHEAD=0
insert_gcode:
	_ON_TOOLHEAD_FILAMENT_SENSOR_INSERT TOOLHEAD=0

[display_status]

[pause_resume]

[respond]

[exclude_object]

[skew_correction]

# Fläktar – ofta redan definierat i keenzkustoms-filen, men vi har dem här
# bara om du vill utöka senare.

[include shell_command.cfg]

