# ==================================================================================================
# === FILE: printer.cfg
# === PRINTER: Prusa MINI+ Klipper Mod
# === CLEAN VERSION: v1.1
# === OWNER/PROFILE: PGe-10 Edition
# === NOTE: Main entrypoint. Includes are organized; tuning adjusted carefully for this MINI+.
# ==================================================================================================


# ==================================================================================================
# === INCLUDES: UI / BASE / HARDWARE
# ==================================================================================================

[include mainsail.cfg]
[include prusa-mini-plus.cfg]

# ==================================================================================================
# === INCLUDES: MACROS / FEATURES
# ==================================================================================================

[include macros.cfg]
[include shell_command.cfg]
[include macros/*.cfg]

# ==================================================================================================
# === OPTIONAL INCLUDES
# === Uncomment only if these files exist and are configured.
# ==================================================================================================

#[include sensors/accelerometers_dual_adxl345.cfg]
#[include sensors/bme680.cfg]

# ==================================================================================================
# === MCU: MAIN BOARD + HOST MCU
# === To identify MCU device path, run via SSH:
# === ls /dev/serial/by-id/
# ==================================================================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_44004D0011504E374B373820-if00
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

# ==================================================================================================
# === PRINTER: MOTION / LIMITS
# === v1.1 tuning: max_accel raised from 3000 to 3500.
# === This is still conservative for a well-sorted Klipper MINI+.
# ==================================================================================================

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3500
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0

# ==================================================================================================
# === KLIPPER FEATURES: G-CODE / VIRTUAL SD
# ==================================================================================================

[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: ~/printer_data/gcodes

# ==================================================================================================
# === TEMPERATURE SENSORS
# ==================================================================================================

[temperature_sensor Buddy]
sensor_type: temperature_mcu

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 1
max_temp: 100

# ==================================================================================================
# === FILAMENT SENSOR: TOOLHEAD SENSOR T0
# === pause_on_runout is disabled because custom runout macros handle behavior.
# ==================================================================================================

[filament_switch_sensor toolhead_filament_sensor_t0]
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.01
switch_pin: ^PB4
runout_gcode:
    _ON_TOOLHEAD_FILAMENT_SENSOR_RUNOUT TOOLHEAD=0
insert_gcode:
    _ON_TOOLHEAD_FILAMENT_SENSOR_INSERT TOOLHEAD=0

# ==================================================================================================
# === REQUIRED KLIPPER MODULES
# ==================================================================================================

[display_status]
[pause_resume]
[respond]
[exclude_object]
[skew_correction]

