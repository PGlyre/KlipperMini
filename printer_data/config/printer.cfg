# ========================================================================
# printer.cfg – Prusa Mini+
# PGe-10 Edition
#
# This file controls the master configuration and includes all other
# related .cfg files. Hardware values, pins and kinematics are untouched.
# ========================================================================

# ------------------------------------------------------------------------
# Included system files (base configuration)
# ------------------------------------------------------------------------
[include mainsail.cfg]
[include macros.cfg]
[include prusa-mini-plus.cfg]
[include shell_command.cfg]
[include macros/custom_macros.cfg]

# ------------------------------------------------------------------------
# User configuration files (not overwritten by updates)
# ------------------------------------------------------------------------
[include sensors/accelerometers_dual_adxl345.cfg]
[include sensors/bme.cfg]
[include macros/bed_mesh.cfg]
# [include macros/mainsail_custom.cfg]   # Optional custom UI buttons
[include macros/resonance_tuning.cfg]
[include macros/spoolman.cfg]

# Additional include placeholders

# [include xxx.cfg]
# [include xxx.cfg]

# ------------------------------------------------------------------------
# MCU configuration
# To identify your MCU device, run in SSH:
#     ls /dev/serial/by-id/
# ------------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_prusa-buddy-if00
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

# ------------------------------------------------------------------------
# Printer motion and limits
# ------------------------------------------------------------------------
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0

# ------------------------------------------------------------------------
# G-code support extensions
# ------------------------------------------------------------------------
[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: ~/printer_data/gcodes

# ------------------------------------------------------------------------
# Temperature sensors
# ------------------------------------------------------------------------
[temperature_sensor Buddy]
sensor_type: temperature_mcu

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 1
max_temp: 100

# # External chamber temperature sensor
# [temperature_sensor chamber_temp]
# sensor_type: BME280              # <-- change to your real sensor type Generic 3950/BME280/BME680
# sensor_pin: PA0                  # <-- change to **your** MCU pin
# min_temp: 0
# max_temp: 120
# gcode_id: CHAMBER                # optional, but nice for UI

# [temperature_sensor chamber_temp]
# sensor_type: BME280
# i2c_address: 119 # RIP WIRINGPI
# #   Default is 118 (0x76). Some BME280 sensors have an address of 119
# #   (0x77).
# i2c_mcu: rpi
# i2c_bus: i2c.1
# #i2c_speed:
# #   See the "common I2C settings" section for a description of the
# #   above parameters.

# ------------------------------------------------------------------------
# Filament sensor (Prusa Mini+ / KlipperMini)
# ------------------------------------------------------------------------
[filament_switch_sensor toolhead_filament_sensor_t0]
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.01
switch_pin: ^PB4
runout_gcode:
    _ON_TOOLHEAD_FILAMENT_SENSOR_RUNOUT TOOLHEAD=0
insert_gcode:
    _ON_TOOLHEAD_FILAMENT_SENSOR_INSERT TOOLHEAD=0

# ------------------------------------------------------------------------
# Required Klipper modules
# ------------------------------------------------------------------------
[display_status]
[pause_resume]
[respond]
[exclude_object]
[skew_correction]

# (shell_command.cfg is already included above)
# [include shell_command.cfg]

