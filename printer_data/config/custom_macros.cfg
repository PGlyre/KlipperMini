# custom_macros.cfg

[gcode_macro SAFE_LOAD_MESH]
description: Load a BED_MESH profile or calibrate and save if missing
# Usage: SAFE_LOAD_MESH PROFILE=<profile_name>
variable_mesh: "mini_mesh"
gcode:
    {% set NAME = params.PROFILE|default(printer["gcode_macro SAFE_LOAD_MESH"].variable_mesh)|string %}

    {% if printer.bed_mesh is not defined %}
        RESPOND MSG="BED_MESH module not configured in printer.cfg — skipping mesh."
        RETURN
    {% endif %}

    {% set profiles = printer.bed_mesh.profiles %}
    {% if profiles is defined and (NAME in profiles) %}
        RESPOND MSG="Loading existing mesh profile: {NAME}"
        BED_MESH_PROFILE LOAD={NAME}
    {% else %}
        RESPOND MSG="Mesh profile '{NAME}' not found — running BED_MESH_CALIBRATE and saving."
        BED_MESH_CLEAR
        BED_MESH_CALIBRATE PROFILE={NAME}
        BED_MESH_PROFILE SAVE={NAME}
        BED_MESH_PROFILE LOAD={NAME}
    {% endif %}

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True