###############################################################################
# shell_command.cfg
#
# Cheat Sheet:
# - HELLO_WORLD:
#       Simple example showing how a shell command can be executed from G-code.
#
# - update_git:
#       Wrapper around: $HOME/klipper-backup/script.sh
#       Supports optional commit message:
#           update_git MESSAGE="Your text here"
#
# NOTE:
#   No functionality or command logic has been changed.
###############################################################################

# ---------------------------------------------------------------------------
# Example: Simple shell command (for testing)
# ---------------------------------------------------------------------------
[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.0
verbose: True

[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world

# ---------------------------------------------------------------------------
# Git update / Klipper backup integration
# ---------------------------------------------------------------------------
[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        # Run script with a custom commit message
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        # Run script without message
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

# Runs backup script with default behavior
[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

# Runs backup script with a commit message
[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True