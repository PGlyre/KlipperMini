# ==================================================================================================
# === FILE: moonraker.conf
# === SYSTEM: Prusa MINI+ Klipper / Moonraker
# === CLEAN VERSION: v1.1
# === NOTE: Cleaned formatting. Duplicate trusted client entry removed.
# ==================================================================================================


# ==================================================================================================
# === SERVER
# ==================================================================================================

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/pi/printer_data/comms/klippy.sock


# ==================================================================================================
# === AUTHORIZATION
# ==================================================================================================

[authorization]
trusted_clients:
    192.168.0.0/16
    10.0.0.0/8
    127.0.0.0/8
    169.254.0.0/16
    172.16.0.0/12
    FC00::/7
    FE80::/10
    ::1/128

cors_domains:
    *.lan
    *.local
    *://localhost
    *://localhost:*
    *://my.mainsail.xyz
    *://app.fluidd.xyz


# ==================================================================================================
# === MOONRAKER MODULES
# ==================================================================================================

[octoprint_compat]

[history]

[file_manager]
enable_object_processing: True

[spoolman]
server: http://spoolman.local:7912/
sync_rate: 5

# ==================================================================================================
# === UPDATE MANAGER: GLOBAL SETTINGS
# ==================================================================================================

[update_manager]
channel: dev
refresh_interval: 168


# ==================================================================================================
# === UPDATE MANAGER: REPOSITORIES
# ==================================================================================================

[update_manager crowsnest]
type: git_repo
path: ~/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
managed_services: crowsnest
install_script: tools/pkglist.sh

[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

[update_manager mainsail]
type: web
path: /home/pi/mainsail
repo: mainsail-crew/mainsail
channel: stable
persistent_files:
    config.json

[update_manager mainsail-config]
type: git_repo
path: /home/pi/mainsail-config
origin: https://github.com/mainsail-crew/mainsail-config.git
primary_branch: master
managed_services: klipper

[update_manager sonar]
type: git_repo
path: ~/sonar
origin: https://github.com/mainsail-crew/sonar.git
primary_branch: main
managed_services: sonar
system_dependencies: resources/system-dependencies.json

[update_manager led_effect]
type: git_repo
path: ~/klipper-led_effect
origin: https://github.com/julianschill/klipper-led_effect.git
is_system_service: False
