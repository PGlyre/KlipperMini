# macros.cfg
# Custom macros for Prusa Mini+ with Klipper / KlipperMini
# All texts are in English only.

# === Print start and end macros ===

[gcode_macro PRINT_START]
description: PGe10 auto-mesh start for Prusa Mini+ (adaptive mesh + primeline)
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set HOTEND = params.EXTRUDER_TEMP|default(220)|float %}
    {% set RET_LEN = params.RETRACT_LENGTH|default(0.8)|float %}
    {% set RET_SPD = params.RETRACT_SPEED|default(35)|float %}
    {% set UNRET_SPD = params.UNRETRACT_SPEED|default(35)|float %}

    # -------------------------
    # Safety: [bed_mesh] section must exist
    # -------------------------
    {% if 'bed_mesh' not in printer %}
        RESPOND TYPE=error MSG="PRINT_START: [bed_mesh] section is missing in config. Canceling print."
        CANCEL_PRINT
        RETURN
    {% endif %}

    # -------------------------
    # 1) Start heating the bed
    # -------------------------
    M117 Heating bed...
    M140 S{BED}

    G90
    M117 Homing...
    G28

    # -------------------------
    # 2) Wait until the bed has reached the correct temperature
    # -------------------------
    M117 Waiting for bed...
    M190 S{BED}

    # -------------------------
    # 3) Auto adaptive bed mesh (always new, on a hot bed)
    # -------------------------
    M117 Probing bed...
    SAFE_LOAD_MESH

    # -------------------------
    # 4) Raise the nozzle to a safe height
    # -------------------------
    G90
    G1 Z10 F6000

    # -------------------------
    # 5) Heat the hotend to the correct temperature
    # -------------------------
    M117 Heating hotend...
    M104 S{HOTEND}
    M109 S{HOTEND}

    # -------------------------
    # 6) Retraction (pressure advance comes from [extruder])
    # -------------------------
    SET_RETRACTION RETRACT_LENGTH={RET_LEN} RETRACT_SPEED={RET_SPD} UNRETRACT_SPEED={UNRET_SPD}

    # -------------------------
    # 7) Simple, safe primeline without hassle
    # -------------------------
    M117 Priming line
    G92 E0
    G1 E1.2 F600    ; small extra prime
    G90

    ; move Z up a bit first to be safe
    G1 Z0.5 F1200

    ; first line – solid, along the front edge
    G1 X20 Y5 F6000
    G1 X180 Y5 E12 F1500

    ; move a bit in Y without extruding
    G1 X180 Y10 F6000

    ; second line back
    G1 X20 Y10 E12 F1500

    ; reset extruder before the actual print
    G92 E0

    M117 Printing...

[gcode_macro PRINT_END]
description: Safe print end for Prusa Mini+
gcode:
    G91
    G1 E-2 F2100
    G1 Z+10 F600
    G90
    G1 X180 Y180 F6000
    M104 S0
    M140 S0
    M107
    M84

# === Filament change / M600 macros ===

[gcode_macro FILAMENT_CHANGE]
description: Basic filament change macro (used by M600)
gcode:
    PAUSE

[gcode_macro M600]
description: Filament change (M600 alias)
gcode:
    FILAMENT_CHANGE

# === Filament load / purge / resume (smart) ===

[gcode_macro FILAMENT_LOAD]
description: Load filament (to nozzle) with extra purge
gcode:
    M117 Loading filament...
    G91
    G1 E40 F200
    G1 E40 F150
    G1 E20 F100
    G90

[gcode_macro FILAMENT_PURGE]
description: Purge filament at nozzle
gcode:
    M117 Purging filament...
    G91
    G1 E10 F150
    G1 E10 F120
    G90

[gcode_macro FILAMENT_RESUME]
description: Resume print after filament change
gcode:
    M117 Resuming print...
    RESUME

# === Simple manual load / unload (short moves) ===

[gcode_macro LOAD_FILAMENT]
description: Manually load filament (small amount)
gcode:
    M117 Loading filament...
    G91
    G1 E40 F200
    G1 E40 F150
    G90

[gcode_macro UNLOAD_FILAMENT]
description: Manually unload filament (small amount)
gcode:
    M117 Unloading filament...
    G91
    G1 E-50 F200
    G90