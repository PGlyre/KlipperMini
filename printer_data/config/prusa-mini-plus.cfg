# ==================================================================================================
# === FILE: prusa-mini-plus.cfg
# === PRINTER: Prusa MINI+ hardware configuration
# === CLEAN VERSION: v1.1
# === NOTE: Hardware pins/settings preserved. Main [mcu] and [printer] live in printer.cfg.
# ==================================================================================================


# ==================================================================================================
# === FIRMWARE RETRACTION
# ==================================================================================================

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0.0
unretract_speed: 35


# ==================================================================================================
# === MOTION: STEPPER X
# ==================================================================================================

[stepper_x]
step_pin: PD1
dir_pin: PD0
enable_pin: !PD3
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 180.4
position_min: -2
position_max: 180.4
homing_speed: 50
homing_retract_dist: 0


# ==================================================================================================
# === MOTION: STEPPER Y
# ==================================================================================================

[stepper_y]
step_pin: PD13
dir_pin: PD12
enable_pin: !PD14
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -3
position_min: -3
position_max: 180
homing_speed: 50
homing_retract_dist: 0


# ==================================================================================================
# === MOTION: STEPPER Z
# ==================================================================================================

[stepper_z]
step_pin: PD4
dir_pin: !PD15
enable_pin: !PD2
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 185


# ==================================================================================================
# === EXTRUDER
# ==================================================================================================

[extruder]
step_pin: PD9
dir_pin: !PD8
enable_pin: !PD10
microsteps: 16
rotation_distance: 26.2564
gear_ratio: 48:18
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC0
pressure_advance: 0.03
pressure_advance_smooth_time: 0.04
min_temp: 10
max_temp: 290


# ==================================================================================================
# === TMC2209 DRIVERS
# ==================================================================================================

[tmc2209 stepper_x]
uart_pin: PD5
uart_address: 1
diag_pin: ^PE2
driver_SGTHRS: 130
run_current: 0.80
hold_current: 0.35
sense_resistor: 0.22
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PD5
uart_address: 3
diag_pin: ^PE1
driver_SGTHRS: 130
run_current: 0.80
hold_current: 0.35
sense_resistor: 0.22
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PD5
uart_address: 0
diag_pin: ^PE3
driver_SGTHRS: 100
run_current: 0.35
sense_resistor: 0.22
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PD5
uart_address: 2
diag_pin: ^PA15
driver_SGTHRS: 100
run_current: 0.4
sense_resistor: 0.22


# ==================================================================================================
# === HEATER: BED
# ==================================================================================================

[heater_bed]
heater_pin: PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA4
min_temp: 10
max_temp: 110


# ==================================================================================================
# === FANS
# ==================================================================================================

[heater_fan hotend_fan]
pin: PE9
tachometer_pin: PE14
fan_speed: 0.5

[fan]
pin: PE11
tachometer_pin: PE10


# ==================================================================================================
# === PROBE: SUPERPINDA
# ==================================================================================================

[probe]
pin: PA8
x_offset: -25
y_offset: -5
speed: 5.0
samples: 3
samples_result: average
sample_retract_dist: 2.0
samples_tolerance: 0.03
samples_tolerance_retries: 10


# ==================================================================================================
# === HOMING: SAFE Z HOME
# ==================================================================================================

[safe_z_home]
home_xy_position: 90, 90
z_hop: 5
z_hop_speed: 5
speed: 120
